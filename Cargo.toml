[package]
name = "rust-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
overflow-checks = true
